name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure Release build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DGUARDIAN_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure
      - name: Run fault-injection simulator
        run: ./build/guardian_sim
